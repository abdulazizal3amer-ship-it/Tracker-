# نسخة احتياطية أسبوعية مشفّرة من قاعدة البيانات + إبقاء مشروع Supabase المجاني نشطاً
#
# الأسرار المطلوبة (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL      رابط "Session pooler" من Supabase > Connect
#                        (الرابط المباشر يعمل على IPv6 فقط ولا يصل إليه GitHub)
#   BACKUP_PASSPHRASE    كلمة سر قوية لتشفير النسخة — احفظها في مكان آمن
#
# النسخة تُرفع مشفّرة كملف (Artifact) في صفحة التشغيل وتبقى 90 يوماً.
# فك التشفير: gpg --decrypt backup.sql.gz.gpg | gunzip > backup.sql
name: Weekly backup

on:
  schedule:
    - cron: '0 1 * * 5'   # كل جمعة 4:00 فجراً بتوقيت الرياض
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DB_URL postgres:17 \
            sh -c 'pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges' \
            | gzip > backup.sql.gz
          test -s backup.sql.gz
      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 90
